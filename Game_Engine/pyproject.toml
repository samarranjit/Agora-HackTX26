[project]
name = "learning-game-engine"
version = "0.1.0"
description = "Pure rules and state transitions for the learning game: XP, health, unlocks, and battles."
readme = "README.md"
authors = [
    { name = "Samar Ranjit", email = "84336809+samarranjit@users.noreply.github.com" }
]
requires-python = ">=3.12"
# Deliberately empty: the engine uses only the standard library.
dependencies = []

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, bugbear, pyupgrade, simplify.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.2",
]
